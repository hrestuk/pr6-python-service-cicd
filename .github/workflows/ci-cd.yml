
name: PR6 CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-tests:
    name: pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          mkdir -p reports
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run application tests
        run: |
          python -m pytest -v tests/test_app.py \
            --junitxml=reports/pytest.xml

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-report-${{ github.sha }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  container-checks:
    name: Docker build, Testinfra and HTTP checks
    runs-on: ubuntu-latest

    env:
      APP_VERSION: ${{ github.sha }}
      SIMULATE_HEALTH_FAILURE: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          mkdir -p reports
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Build Docker image
        run: |
          docker build --pull \
            -t "pr6-python-service:${GITHUB_SHA}" \
            -t "pr6-python-service:local" \
            .

      - name: Start container
        run: |
          docker compose up -d --no-build

      - name: Wait for HTTP health check
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 2 \
              http://127.0.0.1:5000/health; then
              echo
              echo "Health check passed."
              exit 0
            fi
            sleep 2
          done

          echo "Service did not become healthy in 60 seconds." >&2
          docker compose ps
          exit 1

      - name: Verify HTTP endpoints
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          def get_json(url):
              with urllib.request.urlopen(url, timeout=3) as response:
                  assert response.status == 200
                  return json.load(response)

          health = get_json("http://127.0.0.1:5000/health")
          assert health == {"status": "ok"}, health

          version = get_json("http://127.0.0.1:5000/version")
          expected = {"version": os.environ["APP_VERSION"]}
          assert version == expected, version

          print("HTTP health and version checks passed.")
          PY

      - name: Run Testinfra
        run: |
          python -m pytest -v \
            --hosts=docker://pr6-app \
            tests/test_infra.py \
            --junitxml=reports/testinfra.xml

      - name: Export image for deployment
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker save "pr6-python-service:${GITHUB_SHA}" \
            -o reports/pr6-image.tar

      - name: Collect container diagnostics
        if: always()
        run: |
          mkdir -p reports
          docker compose ps --all > reports/compose-ps.txt 2>&1 || true
          docker compose logs --no-color > reports/container.log 2>&1 || true
          docker inspect pr6-app > reports/container-inspect.json 2>&1 || true

      - name: Upload container reports and image
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: container-checks-${{ github.sha }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop container
        if: always()
        run: docker compose down --volumes --remove-orphans || true
