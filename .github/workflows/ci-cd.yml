
name: PR6 CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      simulate_health_failure:
        description: "Simulate /health failure to test rollback"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  unit-tests:
    name: pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          mkdir -p reports
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run application tests
        run: |
          python -m pytest -v tests/test_app.py \
            --junitxml=reports/pytest.xml

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-report-${{ github.sha }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  container-checks:
    name: Docker build, Testinfra and HTTP checks
    runs-on: ubuntu-latest

    env:
      APP_VERSION: ${{ github.sha }}
      SIMULATE_HEALTH_FAILURE: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          mkdir -p reports
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Build Docker image
        run: |
          docker build --pull \
            -t "pr6-python-service:${GITHUB_SHA}" \
            -t "pr6-python-service:local" \
            .

      - name: Start container
        run: docker compose up -d --no-build

      - name: Wait for health endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 2 \
              http://127.0.0.1:5000/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Verify HTTP endpoints
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          def get_json(url):
              with urllib.request.urlopen(url, timeout=3) as response:
                  assert response.status == 200
                  return json.load(response)

          health = get_json("http://127.0.0.1:5000/health")
          assert health == {"status": "ok"}, health

          version = get_json("http://127.0.0.1:5000/version")
          assert version == {"version": os.environ["APP_VERSION"]}, version

          print("HTTP checks passed.")
          PY

      - name: Run Testinfra
        run: |
          python -m pytest -v \
            --hosts=docker://pr6-app \
            tests/test_infra.py \
            --junitxml=reports/testinfra.xml

      - name: Export image for deployment
        if: >-
          success() &&
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' ||
           github.event_name == 'workflow_dispatch')
        run: |
          docker save "pr6-python-service:${GITHUB_SHA}" \
            -o reports/pr6-image.tar

      - name: Collect container diagnostics
        if: always()
        run: |
          docker compose ps --all > reports/compose-ps.txt 2>&1 || true
          docker compose logs --no-color > reports/container.log 2>&1 || true
          docker inspect pr6-app > reports/container-inspect.json 2>&1 || true

      - name: Upload reports and image
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: container-checks-${{ github.sha }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop CI container
        if: always()
        run: docker compose down --volumes --remove-orphans || true

  deploy:
    name: Deploy to Ubuntu VM
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch')
    needs: [unit-tests, container-checks]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      VM_HOST: "100.70.46.82"
      VM_USER: "pr6user"
      REMOTE_DIR: "/home/pr6user/pr6-deploy"
      SIMULATE_HEALTH_FAILURE: ${{ inputs.simulate_health_failure && 'true' || 'false' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download verified image artifact
        uses: actions/download-artifact@v7
        with:
          name: container-checks-${{ github.sha }}
          path: reports

      - name: Check image artifact
        run: test -s reports/pr6-image.tar

      - name: Connect to Tailscale
        id: tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          version: latest

      - name: Configure SSH key
        id: ssh
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -eu
          test -n "$DEPLOY_SSH_KEY"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' \
            > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -H "$VM_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Verify SSH and Docker access
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VM_USER@$VM_HOST" \
            'id -un && docker info >/dev/null && echo "SSH and Docker access OK"'

      - name: Copy image and deployment files
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VM_USER@$VM_HOST" \
            "mkdir -p '$REMOTE_DIR'"

          scp -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            reports/pr6-image.tar compose.deploy.yaml scripts/deploy.sh \
            "$VM_USER@$VM_HOST:$REMOTE_DIR/"

      - name: Deploy and verify health
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VM_USER@$VM_HOST" \
            "bash '$REMOTE_DIR/deploy.sh' '$GITHUB_SHA' '$SIMULATE_HEALTH_FAILURE'"

      - name: Collect VM diagnostics
        if: always() && steps.tailscale.outcome == 'success' && steps.ssh.outcome == 'success'
        run: |
          mkdir -p deployment-reports
          ssh -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VM_USER@$VM_HOST" \
            'docker ps -a --filter name=pr6-app; docker logs pr6-app 2>&1 || true' \
            > deployment-reports/vm-container.log 2>&1 || true

          ssh -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VM_USER@$VM_HOST" \
            'curl --silent --show-error --max-time 3 -i http://127.0.0.1:5000/health || true' \
            > deployment-reports/vm-health.txt 2>&1 || true

      - name: Upload VM diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deployment-diagnostics-${{ github.sha }}
          path: deployment-reports/
          if-no-files-found: warn
          retention-days: 14
