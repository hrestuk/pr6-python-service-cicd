services:
  app:
    build:
      context: .
    image: pr6-python-service:local
    container_name: pr6-app
    ports:
      - "5000:5000"
    environment:
      APP_VERSION: ${APP_VERSION:-0.1.0}
      SIMULATE_HEALTH_FAILURE: ${SIMULATE_HEALTH_FAILURE:-false}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s